services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: base-project-arvrcv
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      PORT: 5000
      DEBUG: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
